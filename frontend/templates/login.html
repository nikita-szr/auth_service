{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Вход по номеру телефона</h2>

    {% if error_message %}
        <p style="color: red;">{{ error_message }}</p>
    {% endif %}

    <form method="post" class="mt-3">
        {% csrf_token %}
        <div class="mb-3">
            <label for="phone" class="form-label">Введите номер телефона:</label>
            <input type="text" name="phone" id="phone" class="form-control" required placeholder="+7XXXXXXXXXX">
        </div>
        <button type="submit" class="btn btn-primary">Получить код</button>
    </form>
    <div class="mt-3">
        <a href="{% url 'frontend:register' %}" class="btn btn-outline-secondary">Регистрация</a>
    </div>
</div>
{% endblock %}
