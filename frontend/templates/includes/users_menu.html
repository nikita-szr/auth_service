<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Сервис для авторизации по номеру телефона</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="{% url 'frontend:index' %}">Главная</a>
        {% if perms.users.view_all_users or user.is_superuser %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'frontend:user_list' %}">Пользователи сервиса</a>
        {% endif %}
        {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'frontend:user_detail' %}">Мой профиль</a>
        <form action="{% url 'frontend:logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="p-2 btn btn-outline-primary">Выход</button>
        </form>
        {% else %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'frontend:login' %}">Авторизация</a>
        <a class="p-2 btn btn-outline-success" href="{% url 'frontend:register' %}">Регистрация</a>
        {% endif %}
    </nav>
</div>
